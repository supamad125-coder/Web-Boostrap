<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!--menu-->
     <div id="menu-container"></div>
<!--content-->
    <div class="container">
        <div class="alert alert-info mt-4" role="alert">
            หน้าหลัก
        </div>
        <div class="alert alert-light text-center" role="alert">
            Attapol Supama
        </div>

        <div class="text-end mb-4">
            <a class="btn btn-success " href="https://www.google.com/">Google</a>
        </div>
        <div>
            <div class="container text-center">
                <div class="row align-items-stretch g-3 p-2">
                    <div class="col-sm-4 bg-primary-subtle">
                        <img src="img/Hoshino.png" width="100%">
                        Ohshino
                    </div>
                    <div class="col-sm-4 bg-secondary-subtle">
                        <img src="img/Ibuki.png" width="100%">
                        Ibuki
                    </div>
                    <div class="col-sm-4 bg-danger-subtle"> <br>
                        <h3 class="text-center mb-4">Register</h3>
                        <form class="text-start">
                            <div class="mb-3">
                                <label class="form-label">Firstname</label>
                                <input type="text" class="form-control" id="Firstname" required
                                    placeholder="input Firstname">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Lastname</label>
                                <input type="text" class="form-control" id="Lastname" required
                                    placeholder="input Lastname">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Telephone</label>
                                <input type="tel" class="form-control" id="Telephone" required
                                    placeholder=" ###-###-####">
                            </div>
                            <div class="mb-3"> Province
                                <select class="form-select" aria-label="Default select example">
                                    <option selected>เลือกจังหวัด</option>
                                    <option value="1">ชลบุรี</option>
                                    <option value="2">ระยอง</option>
                                    <option value="3">สระแก้ว</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="exampleInputEmail1" required
                                    placeholder="####@gmail.com">
                            </div>
                            <div class="mb-3">
                                <label for="exampleInputPassword1" class="form-label">Password</label>
                                <input type="password" class="form-control" id="exampleInputPassword1" required
                                    placeholder="********">
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="exampleCheck1">
                                <label class="form-check-label" for="exampleCheck1">Check me out</label>
                            </div>
                            <div class="text-center mb-4">
                            <button type="button" class="btn btn-primary">Submit</button>
                            <button type="button" class="btn btn-danger">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

    </div>
</body>

</html>
<script src="js/bootstrap.min.js"></script>
<script src="js/menu.js"></script>
